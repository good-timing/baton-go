# submodules: true is needed: the conformance and scrub tests read baton-spec.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spec-pin:
    # Warns, never fails: a stale pin is how SDKs drift apart unnoticed, but
    # bumping it is its own change with its own vectors to pass. Not on PRs,
    # so the same warning does not sit on every unrelated one.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .gitmodules
          sparse-checkout-cone-mode: false
      - name: Does the baton-spec pin differ from baton-spec main?
        run: |
          pinned=$(git ls-tree HEAD baton-spec | awk '$1 == "160000" { print $3 }')
          url=$(git config -f .gitmodules submodule.baton-spec.url || true)
          latest=$(timeout 30 git ls-remote "$url" refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }' || true)
          if [ -z "$pinned" ] || [ -z "$latest" ]; then
            echo "::warning title=baton-spec pin not checked::could not read the pin or $url"
          elif [ "$pinned" != "$latest" ]; then
            echo "::warning title=baton-spec pin differs from main::pinned $pinned, baton-spec main is $latest"
          fi

  test:
    # go.mod requires go-sdk's floor, which is what a vendor on it builds with.
    # v1.7.0 can only test a 2026-07-28 client; v1.8.0 runs with a client of each.
    name: test (go-sdk ${{ matrix.go-sdk }}${{ matrix.protocol && format(', client protocol {0}', matrix.protocol) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-sdk: floor
          - go-sdk: v1.7.0
          - go-sdk: v1.8.0
          - go-sdk: v1.8.0
            protocol: "2025-11-25"
    env:
      BATON_TEST_MCP_PROTOCOL: ${{ matrix.protocol }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - if: matrix.go-sdk != 'floor'
        run: go get github.com/modelcontextprotocol/go-sdk@${{ matrix.go-sdk }} && go mod tidy
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
